name: Early-access feedback
description: Share a preview problem, missing capability or evaluation result.
title: "[Preview feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for evaluating Sentinel. This issue is **public**.
        Do not include credentials, raw logs, IP/MAC addresses, private files or sensitive site details.
        Sentinel 0.5 is a free evaluation preview. Real equipment requires collector and control-plane setup; autonomous repairs are not included.
  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: 0.5.0-preview
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What kind of feedback is this?
      options:
        - Installation or launch problem
        - Incorrect or missing reading
        - Confusing workflow or documentation
        - Missing connector or capability
        - General evaluation feedback
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: What did you evaluate?
      options:
        - Sample environment
        - Local Windows tools
        - Host collector with my own control plane
        - Configured Redfish collector with my own control plane
        - Setup documentation only
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What did you try, and what happened?
      description: Explain the workflow and expected result without private system details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What would make Sentinel useful in your work?
      description: Describe a missing measurement, connector or task and why it matters. Avoid confidential facility details.
    validations:
      required: false
